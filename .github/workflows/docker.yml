name: Docker-image

# Bouwt bij elke push naar main (en bij een versietag v1.2.3) het image en zet het op
# ghcr.io/<eigenaar>/wifi-portal, voor amd64 (gewone NAS/pc) en arm64 (Raspberry Pi e.d.).
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["portal/**", ".github/workflows/docker.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=wifi-portal
            org.opencontainers.image.description=Webportal voor Omada PPSK-sleutels per apparaat

      - uses: docker/build-push-action@v6
        with:
          context: ./portal
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
