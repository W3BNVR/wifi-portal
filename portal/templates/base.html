<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wifi-toegang</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --mute:#6b7280; --line:#e5e7eb;
          --acc:#0b6bcb; --ok:#127a3a; --err:#b42318; --warn:#9a6700; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111418; --card:#1a1f26; --ink:#e7eaee; --mute:#9aa3ad; --line:#2a313a;
            --acc:#4ea1ff; --ok:#4cc38a; --err:#ff7b72; --warn:#e3b341; } }
  * { box-sizing:border-box }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         background:var(--bg); color:var(--ink) }
  main { max-width:760px; margin:0 auto; padding:16px }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px }
  h1 { font-size:20px; margin:0 } h2 { font-size:16px; margin:0 0 8px }
  a { color:var(--acc) }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px;
          padding:14px; margin-bottom:14px }
  .muted { color:var(--mute); font-size:13px }
  .row { border-top:1px solid var(--line); padding:10px 0; display:grid; gap:6px }
  .row:first-of-type { border-top:0 }
  .mac { font-family:ui-monospace,Menlo,monospace; font-size:13px }
  .inline { display:flex; gap:6px; flex-wrap:wrap; align-items:center }
  input, select, button, textarea { font:inherit; padding:8px 10px; border-radius:8px;
          border:1px solid var(--line); background:var(--card); color:var(--ink) }
  input[type=text] { flex:1 1 160px; min-width:0 }
  label > input[type=text] { width:100% }
  button { background:var(--acc); color:#fff; border:0; cursor:pointer }
  button.ghost { background:transparent; color:var(--err); border:1px solid var(--line) }
  .flash { padding:10px 12px; border-radius:8px; margin-bottom:10px; border:1px solid var(--line) }
  .flash.ok { color:var(--ok) } .flash.err { color:var(--err) }
  .tag { font-size:12px; padding:1px 7px; border-radius:99px; border:1px solid var(--line) }
  .tag.warn { color:var(--warn) } .tag.ok { color:var(--ok) }
  details summary { cursor:pointer }
  details.vgrp { border-top:1px solid var(--line); padding:8px 0 2px }
  details.vgrp > summary { padding:4px 0 6px; list-style-position:inside }
  details.vgrp > .row:first-of-type { border-top:0 }
  .qrs { display:flex; gap:16px; flex-wrap:wrap; justify-content:center }
  .qr { text-align:center } .qr svg { width:220px; height:220px; background:#fff; border-radius:8px }
  .psk { font:600 22px/1.3 ui-monospace,Menlo,monospace; letter-spacing:1px; text-align:center;
         padding:10px; border:1px dashed var(--line); border-radius:8px; user-select:all }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--mute) }
  .dot.on { background:var(--ok) }
  nav a { margin-left:10px }
  .dev { display:flex; gap:10px; align-items:flex-start }
  .ico { font-size:24px; line-height:1; width:32px; text-align:center; flex:none }
  .ico.big { font-size:28px; width:auto }
  .vl select { max-width:150px }
  .split { display:grid; grid-template-columns:1fr 1fr; margin-top:16px }
  .split > div { min-width:0 }
  .split > div:first-child { padding-right:16px; border-right:1px solid var(--line) }
  .split > div + div { padding-left:16px }
  .split .vl select { max-width:none; width:100% }
  @media (max-width:560px) { .split { grid-template-columns:1fr }
    .split > div:first-child { padding:0 0 12px; border-right:0; border-bottom:1px solid var(--line) }
    .split > div + div { padding:12px 0 0 } }
  .small { font-size:12px; max-width:160px }
  dl.grid { display:grid; grid-template-columns:max-content 1fr; gap:4px 14px; margin:10px 0 0 }
  dl.grid dt { color:var(--mute) } dl.grid dd { margin:0; overflow-wrap:anywhere }
  .icons { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px }
  .icons input { display:none }
  .icons span { display:inline-block; min-width:36px; padding:4px 6px; text-align:center; font-size:20px;
                border:1px solid var(--line); border-radius:8px; cursor:pointer }
  .icons label:first-child span { font-size:13px; line-height:28px }
  .icons input:checked + span { border-color:var(--acc); box-shadow:0 0 0 2px var(--acc) }
  @media (max-width:560px) { .dev { flex-wrap:wrap } .vl { width:100%; padding-left:42px } .vl select { max-width:none; width:100% } }
  .split .vl { padding-left:0 }
  @media (max-width:560px) { .split .vl { padding-left:0 } }
</style>
</head>
<body><main>
{% with msgs = get_flashed_messages(with_categories=true) %}
  {% for cat, m in msgs %}<div class="flash {{cat}}">{{ m }}</div>{% endfor %}
{% endwith %}
{% block body %}{% endblock %}
</main></body>
</html>
