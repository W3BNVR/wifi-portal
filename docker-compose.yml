services:
  wifi-portal:
    # Bouwt het image rechtstreeks uit GitHub (map portal/ van branch main).
    # Bijwerken naar de nieuwste versie: docker compose build --pull --no-cache && docker compose up -d
    build:
      context: https://github.com/W3BNVR/wifi-portal.git#main:portal
    image: wifi-portal:latest
    container_name: wifi-portal
    restart: unless-stopped
    ports:
      - "8098:8080"
    env_file: .env
    volumes:
      - ./data:/data          # config.json, state.json, portal.db, secret.key
